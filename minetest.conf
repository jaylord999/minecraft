# This is a game specific minetest.conf file, do not edit

# If any of these settings are set in your minetest.conf file in ~/.minetest (Linux) or in the root directory of the game (Run in place/Windows)
# They will override these settings

# Basic game rules
time_speed = 72

# Player physics
movement_acceleration_default = 2.4
movement_acceleration_air = 1.2
#movement_acceleration_fast = 10

movement_speed_walk = 4.317
movement_speed_crouch = 1.295
movement_speed_fast = 25.0

movement_speed_jump = 6.6
movement_speed_climb = 2.35
# TODO: Add descend speed (3.0) when available

movement_liquid_fluidity = 1.13
movement_liquid_fluidity_smooth = 0.5
movement_liquid_sink = 23

movement_gravity = 10.4

# Controls (Minecraft parity)
# Keep auto-jump enabled for the Minecraft-like helper feel, but reduce the
# engine step height so descending over block edges doesn't feel like climbing
# a staircase.
autojump = true
movement_step_height = 0.45
# Double-tap the jump key to toggle fly mode (Minecraft creative flight).
doubletap_jump = true
# Minecraft uses E for the inventory. The engine default is I, which frees up
# E to act as "Aux1" (used for sprinting, see the next line).
keymap_inventory = SYSTEM_SCANCODE_8
# Minecraft sprints with Left Control. Aux1 + forward is what mcl_sprint
# listens to, so binding Aux1 to Left Control gives Minecraft's sprint key.
keymap_aux1 = SYSTEM_SCANCODE_224

# Mapgen stuff

# altitude_chill and altitude_dry doesn't go well together with MCL2 biomes
# which already include "snowed" variants as you go higher.
# humid_rivers would cause the MushroomIsland biome to appear frequently around rivers.
mgvalleys_spflags = noaltitude_chill,noaltitude_dry,nohumid_rivers,vary_river_depth

# MCL2-specific stuff
keepInventory = false

# Performance settings
dedicated_server_step = 0.05 #tick rate
# abm_interval = 0.25
# max_objects_per_block = 4096
# max_packets_per_iteration = 10096

# Rendering / distant-texture test profile for Luanti desktop preview
# These are intended to make far blocks use lower-detail filtering instead of
# showing full-res textures too aggressively.
mip_map = true
anisotropic_filter = 8

# Clientmodding to support official client
enable_client_modding = true
csm_restriction_flags = 0
enable_mod_channels = true
